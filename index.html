
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDENT HOSTEL CARD</title>
<style>
  *{box-sizing:border-box}
  :root{--ink:#17212b;--muted:#737d87;--line:#b9c1ca;--accent:#176381;--bg:#fff}
  body{margin:0;padding:32px 18px;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
  .toolbar{max-width:720px;margin:0 auto;padding:16px 18px 10px;border:1px solid #e3eaf1;border-bottom:0;
    border-radius:11px 11px 0 0;background:#fff;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .toolbar h1{margin:0;font-size:16px;color:#a6a6a6}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button,.file-btn{padding:9px 13px;background:#fff;color:var(--accent);border:1px solid #cbd6e2;border-radius:5px;
    font:bold 14px Arial,sans-serif;cursor:pointer}
  #printBtn{padding:5px 8px;border-color:transparent;background:transparent;color:#a6a6a6;font-size:13px;font-weight:normal}
  button:focus-visible,.file-btn:focus-within{outline:3px solid #9ed9e9;outline-offset:2px}
  .file-btn input{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
  .file-btn{position:relative;display:inline-block}

  .card{max-width:720px;margin:0 auto 30px;padding:0 17px 17px;background:#fff;border:1px solid #e3eaf1;
    border-top:0;border-radius:0 0 11px 11px;box-shadow:0 8px 14px rgba(31,59,80,.06)}
  .status-row{display:flex;justify-content:space-between;font-size:13px;color:#89929b;padding:7px 6px 12px}
  .card-content{position:relative;isolation:isolate;overflow:hidden;border:1px solid #aaa;background:#fff;padding:16px 18px 20px}

  .watermark{position:absolute;z-index:-1;top:50%;left:50%;width:min(62%,390px);height:auto;
    transform:translate(-50%,-46%);opacity:.27;pointer-events:none}

  .head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
  .university-brand{display:flex;align-items:center;gap:9px;min-width:0;flex:0 0 auto}
  .logo-mark{display:block;width:74px;height:74px;flex:0 0 74px;border-radius:50%;object-fit:contain}
  .university-name{font-size:clamp(11px,1.5vw,14px);font-weight:900;letter-spacing:.8px;line-height:1.2;color:#08719a;white-space:nowrap}
  .university-name span{display:block}
  .university-name small{font-size:.72em;letter-spacing:0;text-transform:lowercase}
  .head .campus{flex:0 1 40%;width:40%!important;max-width:40%;min-width:0;font-size:clamp(12px,1.8vw,15px);font-weight:900;letter-spacing:0;text-align:right}
  .college{text-align:center;font-weight:bold;font-size:clamp(13px,1.8vw,16px);margin:10px 0 9px}
  .big-title{text-align:center;font-size:clamp(18px,2.8vw,23px);font-weight:900;text-decoration:underline;margin:0 0 14px}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:10px;align-items:start}
  .details p{margin:0 0 6px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
  .details label{display:flex;align-items:baseline;gap:4px;margin-bottom:5px;font-size:14px;line-height:1.4}
  .details span.k{font-weight:bold;flex:0 0 auto}
  .details label .editable{flex:1 1 0;min-width:0;width:auto}
  .details label.program-field .editable{font-size:12px}
  .editable{border:0;background:transparent;font:inherit;color:inherit;
    padding:1px 2px;width:min(100%,380px)}
  .editable:focus-visible{outline:2px solid var(--accent);background:#f4f9ff}

  .photo{width:100%;aspect-ratio:200/228;border:1px solid var(--line);background:#f0f0f0;display:grid;
    place-items:center;text-align:center;color:#687582;font-size:13px;padding:8px;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}

  .qr{text-align:center}
  .qr-frame{border:1px solid #9aa6c4;border-radius:5px;padding:7px 7px 5px;background:#fff}
  .qr-box{width:100%;aspect-ratio:1;background:#fff;display:grid;place-items:center}
  .qr-box svg,.qr-box img{width:100%;height:100%;display:block}
  .qr p{font-size:11px;font-weight:bold;letter-spacing:.5px;margin:4px 0 0;color:var(--ink)}
  .qr-actions{margin-top:8px}
  .qr-actions button{width:100%;font-size:12px;padding:7px 5px}
  .qr-input{margin-top:8px;width:100%;font:12px Arial;padding:6px}

  .photo-actions{margin-top:14px}
  .photo-actions button{color:var(--accent);border-color:#6b86ac}

  /* Page opened from the QR code: display the printable card view. */
  body.viewer{padding:24px;background:#e8eef6}
  body.viewer .toolbar{max-width:864px;margin:0 auto 16px;padding:12px 16px;border:0;border-radius:10px;
    background:#1f3b73;color:#fff}
  body.viewer .toolbar h1{color:#fff;font-size:16px}
  body.viewer #printBtn{padding:9px 14px;border:0;border-radius:7px;background:#fff;color:#1f3b73;
    font-size:14px;font-weight:bold}
  body.viewer .card{max-width:864px;margin:0 auto;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
  body.viewer .status-row{display:none}
  body.viewer .card-content{min-height:418px;padding:24px 22px 22px}
  body.viewer .watermark{width:min(66%,540px)}
  body.viewer .qr{display:none}
  body.viewer .layout{grid-template-columns:minmax(0,1fr) 200px}
  body.viewer .details label{font-size:16px;line-height:1.5;margin-bottom:3px}
  body.viewer .details label.program-field .editable{font-size:16px}
  body.viewer .photo{aspect-ratio:165/188}
  body.viewer .editable{pointer-events:none}
  body.viewer .photo-actions{display:none}
  @media (max-width:720px){
    body.viewer .layout{grid-template-columns:1fr}
    body.viewer .photo{max-width:200px;justify-self:center}
    body.viewer{padding:18px 10px}
    body.viewer .card-content{padding:16px 14px;min-height:0}
    body{padding:18px 10px}.card{padding:0 10px 12px}.toolbar{padding:14px 12px 9px}
    .card-content{padding:13px 12px 15px}
    .layout{grid-template-columns:minmax(0,1fr) 128px 128px;gap:8px}
    .details{grid-column:auto}
    .head .campus{text-align:right}
  }
  @media (max-width:560px){
    .layout{grid-template-columns:minmax(0,1fr) minmax(110px,140px)}
    .details{grid-column:1/-1}
    body.viewer .layout{grid-template-columns:1fr}
    .head{align-items:flex-start;flex-wrap:wrap}
    .university-brand{flex:1 1 100%}
    .logo-mark{width:52px;height:52px;flex-basis:52px}
    .university-brand{gap:6px}
    .university-name{letter-spacing:.7px}
    .head .campus{flex:1 1 100%;width:100%!important;max-width:none;font-size:13px;text-align:left!important}
    body.viewer .card{padding:0}
    body.viewer .toolbar{padding:12px}
    body.viewer .details label{font-size:14px}
    body.viewer .details label.program-field .editable{font-size:13px}
  }
  @media print{
    @page{size:A4 landscape;margin:10mm}
    body{background:#fff;padding:0}
    .toolbar,.no-print{display:none!important}
    .card{margin:0;max-width:none;border:0;padding:0}
    .card-content,.watermark{print-color-adjust:exact;-webkit-print-color-adjust:exact}
    }
</style>
</head>

<script>
(function(){
  var store = {
    get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };

  // Opened from the QR code? Restore its card fields and show the printable card view.
  var cardKeys = ['campus','college','name','reg','school','program','year','ay','room','hostel'];
  var viewer = location.hash === '#view' || location.hash.indexOf('#view=') === 0;
  var viewerData = null;
  if(location.hash.indexOf('#view=') === 0){
    try{
      viewerData = JSON.parse(decodeURIComponent(location.hash.slice(6)));
      if(!viewerData || typeof viewerData !== 'object' || Array.isArray(viewerData)){
        throw new Error('Card link data is not an object');
      }
      cardKeys.forEach(function(key){
        if(typeof viewerData[key] !== 'string') throw new Error('Card link is missing ' + key);
      });
    }catch(error){
      window.alert('This card link is invalid or incomplete.');
      viewer = false;
      viewerData = null;
    }
  }
  if(viewer){
    document.body.classList.add('viewer');
    if(viewerData){
      cardKeys.forEach(function(key){
        document.querySelector('[data-key="' + key + '"]').value = viewerData[key];
      });
    }
    document.querySelectorAll('.editable').forEach(function(el){ el.readOnly = true; });
    try {
      if(window.history && window.history.replaceState){
        var viewerUrl = new URL(location.href);
        viewerUrl.hash = '';
        history.replaceState(null, '', viewerUrl.toString());
      }
    } catch (error) {
      // Ignore URL rewrite issues; the viewer is still displayed correctly.
    }
    document.title = 'UR Hostels — Student Hostel Card';
    document.getElementById('toolbarTitle').textContent = 'UR Hostels — Student Hostel Card';
    document.getElementById('printBtn').textContent = 'Print';
  }

  // Owner mode: restore and save edits in this browser
  if(!viewer){
    document.querySelectorAll('.editable').forEach(function(el){
      var saved = store.get('ref2:'+el.dataset.key);
      if(saved !== null) el.value = saved;
      el.addEventListener('input', function(){ store.set('ref2:'+el.dataset.key, el.value); });
    });
  }

  // QR: built automatically from the fields above, in the browser (nothing is sent anywhere)
  var qrBox = document.getElementById('qrBox');
  function val(k){ var el=document.querySelector('[data-key="'+k+'"]'); return el ? el.value.trim() : ''; }
  var academicYearStatus = document.getElementById('academicYearStatus');
  if(academicYearStatus) academicYearStatus.textContent = val('ay');
  function renderQR(){
    var online = /^https?:$/.test(location.protocol);
    var cardData = {};
    cardKeys.forEach(function(key){ cardData[key] = val(key); });
    var pageUrl = location.href.split('#')[0];
    var txt = online ? pageUrl + '#view=' + encodeURIComponent(JSON.stringify(cardData)) : 'UNOFFICIAL COPY\n' +
      'Names: ' + val('name') + '\n' +
      'Reg Number: ' + val('reg') + '\n' +
      'Program: ' + val('program') + '\n' +
      'Year of Study: ' + val('year') + '\n' +
      'Academic Year: ' + val('ay') + '\n' +
      'Room Code: ' + val('room') + '\n' +
      'Hostel: ' + val('hostel');
    try{
      var qr = qrcode(0,'M'); qr.addData(txt); qr.make();
      qrBox.innerHTML = qr.createSvgTag({cellSize:4, margin:0, scalable:true});
    }catch(e){ qrBox.textContent = 'Details too long for a QR code'; }
  }
  document.querySelectorAll('.editable').forEach(function(el){
    el.addEventListener('input', function(){
      if(el.dataset.key === 'ay' && academicYearStatus) academicYearStatus.textContent = el.value;
      renderQR();
    });
  });
  if(!viewer) renderQR();

  document.getElementById('downloadQrBtn').addEventListener('click', function(){
    var svg = qrBox.querySelector('svg');
    if(!svg){
      window.alert('Please wait until the QR code is generated.');
      return;
    }
    var source = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg);
    var url = URL.createObjectURL(new Blob([source], {type:'image/svg+xml'}));
    var link = document.createElement('a');
    link.href = url;
    link.download = 'hostel-card-qr.svg';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  var photoFile = document.getElementById('photoFile');
  document.getElementById('updatePhotoBtn').addEventListener('click', function(){ photoFile.click(); });
  photoFile.addEventListener('change', function(){
    var file = photoFile.files && photoFile.files[0];
    if(!file) return;
    if(!file.type || file.type.indexOf('image/') !== 0){
      window.alert('Please choose an image file for the passport photo.');
      photoFile.value = '';
      return;
    }
    var reader = new FileReader();
    reader.onload = function(){
      var photo = document.querySelector('#photo img');
      if(typeof reader.result === 'string') photo.src = reader.result;
    };
    reader.onerror = function(){
      window.alert('The selected photo could not be loaded. Please try another image.');
    };
    reader.readAsDataURL(file);
  });
})();
</script>
</body>
</html>
